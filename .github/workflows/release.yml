name: Release

# Push a tag that matches the version in pyproject.toml to cut a release:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  build:
    name: Build release artifacts
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: Tag must match pyproject version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build sdist and wheel
        run: uv build
      - name: twine check
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-xtermjs/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC), no API token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${VERSION}" > notes.md
          cat notes.md
      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag
