name: Code quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
      - name: ruff check
        run: uvx ruff check --output-format=github .
      - name: ruff format
        run: uvx ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev extras
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: pytest
        run: uv run --no-sync pytest -v

  build:
    name: Build and check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: Preflight (package metadata)
        run: uv run --no-project python scripts/preflight_check.py .
      - name: Build sdist and wheel
        run: uv build
      - name: twine check
        run: uvx twine check --strict dist/*
      - name: Wheel ships the JS shim and type stubs
        run: |
          unzip -l dist/*.whl | tee wheel.txt
          grep -q "reflex_xtermjs/xterm_wrapper.jsx" wheel.txt
          grep -q "reflex_xtermjs/xtermjs.pyi" wheel.txt
      - name: Install wheel in a clean env and import it
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/*.whl
          /tmp/wheel-env/bin/python -c "import reflex_xtermjs, reflex_xtermjs.pty; print('ok')"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
